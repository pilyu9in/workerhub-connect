name: Installer checks and release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell 5.1 and configuration regressions
        shell: powershell
        run: ./tests/smoke.ps1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell wrapper and macOS configuration
        run: |
          sh -n workerhub-macos.command
          sh workerhub-macos.command --help
          python3 -m unittest discover -s tests -p 'test_macos_command.py' -v
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [powershell, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish both installers from the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum workerhub.cmd workerhub-macos.command > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "WORKERHUB Connect $RELEASE_TAG" --notes-from-tag workerhub.cmd workerhub-macos.command SHA256SUMS.txt
